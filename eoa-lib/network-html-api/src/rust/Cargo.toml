[package]
name = "eoa_security"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib", "cdylib"]

[features]
jvm = ["dep:jni", "dep:jni_fn"]

[dependencies]
jni = { version = "0.21.1", optional = true }
jni_fn = { version = "0.1.2", optional = true }
rsa = { version = "0.9.8", features = ["hazmat"] }
base64 = "0.22.1"
crypto-bigint = "0.6.1"

[profile.release]
panic = "abort"
strip = true
lto = true
codegen-units = 1

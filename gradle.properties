#Gradle
org.gradle.jvmargs=-Xmx8G
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.daemon=true
org.gradle.parallel=true

#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx4G
kotlin.mpp.enableCInteropCommonization=true
kotlin.native.ignoreDisabledTargets=true

# The AtomicFU Gradle transformer expects the legacy androidMainClasses task,
# which does not exist for AGP 9 KMP Android libraries. Use AtomicFU's compiler
# plugin transformation for JVM and Android targets instead.
kotlinx.atomicfu.enableJvmIrTransformation=true

#Android
android.useAndroidX=true
android.nonTransitiveRClass=true

#Project
app.version=4.4.5
app.code=55
app.desugar=false
app.proguard=false
database.version=12

name: CI
on:
  push:
    branches:
      - '**'
    paths:
      - buildSrc/**
      - composeApp/**
      - composeApp-backend/**
      - eoa-lib/**
      - lib/**
      - iosApp/**
      - second-class/**
      - util/**
      - widgetApp/**
      - .github/workflows/CI.yaml
  pull_request:
  workflow_dispatch:

env:
  DO_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.DO_RELEASE || false }}

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Fetch submodules
        run: git submodule update --init --recursive
        shell: bash

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle Wrapper
        run: |
          export APP_PROGUARD=true
          chmod +x ./gradlew
          ./gradlew assembleRelease
      - name: Rename apk
        run: |
          mv composeApp/build/outputs/apk/release/composeApp-release.apk composeApp/build/outputs/apk/release/android.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android.apk
          path: composeApp/build/outputs/apk/release/android.apk
      - name: Upload Proguard Mapping File
        uses: actions/upload-artifact@v4
        with:
          name: proguard-android.mapping
          path: composeApp/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

  build-android-6:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Fetch submodules
        run: git submodule update --init --recursive
        shell: bash

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle Wrapper
        run: |
          export APP_PROGUARD=true
          export APP_DESUGAR=true
          chmod +x ./gradlew
          ./gradlew assembleRelease
      - name: Rename apk
        run: |
          mv composeApp/build/outputs/apk/release/composeApp-release.apk composeApp/build/outputs/apk/release/android.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-6.apk
          path: composeApp/build/outputs/apk/release/android.apk
      - name: Upload Proguard Mapping File
        uses: actions/upload-artifact@v4
        with:
          name: proguard-android-6.mapping
          path: composeApp/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

  build-ios:
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Fetch submodules
        run: git submodule update --init --recursive
        shell: bash

      - name: Install Rust Toolchain
        run: rustup default 1.86.0 && rustup target add aarch64-apple-ios && rustup component add rustfmt clippy

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Switch XCode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Build with Gradle Wrapper
        run: |
          export PATH=/Applications/Xcode_26.6.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS.sdk/usr/lib:$PATH
          export LIBRARY_PATH="$LIBRARY_PATH:/Applications/Xcode_26.6.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS.sdk/usr/lib"
          ./gradlew buildReleaseIpa

      - name: Rename artifact
        run: |
          mv composeApp/build/archives/release/iosApp.ipa composeApp/build/archives/release/ios.ipa

      - name: Upload macos artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios.ipa
          path: composeApp/build/archives/release/ios.ipa

  DO_GITEE_RELEASE:
    runs-on: ubuntu-latest
    needs:
      - build-android
      - build-ios
      - build-android-6
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.DO_RELEASE == true }}
    permissions:
      contents: read
    env:
      GITEE_OWNER: kagg886
      GITEE_REPO: sylu-educational-office-accesser
      GITEE_ACCESS_TOKEN: ${{ secrets.GITEE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Read release info
        id: release-info
        shell: bash
        run: |
          app_version="$(awk -F= '$1 == "app.version" { print $2 }' gradle.properties)"
          if [ -z "${app_version}" ]; then
            echo "app.version is required in gradle.properties" >&2
            exit 1
          fi
          echo "release_tag=${app_version}" >> "${GITHUB_OUTPUT}"
          echo "release_name=${app_version}" >> "${GITHUB_OUTPUT}"

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: android.apk
          path: dist/android

      - name: Download Android 6 artifact
        uses: actions/download-artifact@v4
        with:
          name: android-6.apk
          path: dist/android-6

      - name: Download iOS artifact
        uses: actions/download-artifact@v4
        with:
          name: ios.ipa
          path: dist/ios

name: CI
on:
  push:
    branches:
      - '*'
  pull_request:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Fetch submodules
        run: git submodule update --init --recursive
        shell: bash

      - name: Install Rust Toolchain
        run: rustup default 1.86.0 && rustup target add aarch64-linux-android x86_64-linux-android && rustup component add rustfmt clippy

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle Wrapper
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease
      - name: Rename apk
        run: |
          mv composeApp/build/outputs/apk/release/composeApp-release.apk composeApp/build/outputs/apk/release/android.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android.apk
          path: composeApp/build/outputs/apk/release/android.apk
      - name: Upload Proguard Mapping File
        uses: actions/upload-artifact@v4
        with:
          name: proguard-android.mapping
          path: composeApp/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
  build-ios:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Fetch submodules
        run: git submodule update --init --recursive
        shell: bash

      - name: Install Rust Toolchain
        run: rustup default 1.86.0 && rustup target add aarch64-apple-ios && rustup component add rustfmt clippy

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle Wrapper
        run: |
          export PATH=/Applications/Xcode_16.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS18.0.sdk/usr/lib:$PATH
          export LIBRARY_PATH="$LIBRARY_PATH:/Applications/Xcode_16.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS18.0.sdk/usr/lib"
          ./gradlew buildReleaseIpa

      - name: Rename artifact
        run: |
          mv composeApp/build/archives/release/iosApp.ipa composeApp/build/archives/release/ios.ipa

      - name: Upload macos artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios.ipa
          path: composeApp/build/archives/release/ios.ipa

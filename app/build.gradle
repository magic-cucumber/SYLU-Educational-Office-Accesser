plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kagg886.sylu_eoa'
    compileSdk 34


    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }


    defaultConfig {
        applicationId "com.kagg886.sylu_eoa"
        minSdk 28
        targetSdk 33
        versionCode 16
        versionName "2.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            manifestPlaceholders = [
                    APP_NAME: "@string/app_name",
            ]
        }

        debug {
            applicationIdSuffix ".debug"

            manifestPlaceholders = [
                    APP_NAME: "@string/app_name_debug",
            ]
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    //防止kotlin兼容错误
    implementation(platform("org.jetbrains.kotlin:kotlin-bom:1.8.0"))

    implementation project(':api')
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'

    //-------------------------布局类---------------------------
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0" // 下拉刷新控件
    implementation 'androidx.recyclerview:recyclerview:1.3.0' //回收列表布局
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'


    compileOnly 'org.projectlombok:lombok:1.18.28'
    annotationProcessor 'org.projectlombok:lombok:1.18.28'
    compileOnly 'org.jsoup:jsoup:1.15.3'

    //--------------------------存储类---------------------------
    implementation 'com.alibaba.fastjson2:fastjson2:2.0.37'
    implementation 'com.tencent:mmkv:1.3.1'
    implementation 'top.canyie.pine:core:0.2.6'

    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.2'
    implementation 'androidx.navigation:navigation-fragment:2.7.2'
    implementation 'androidx.navigation:navigation-ui:2.7.2'
    testImplementation 'org.jsoup:jsoup:1.15.3'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}